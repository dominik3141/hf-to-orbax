[project]
name = "hf-safetensors-to-orbax"
version = "0.1.0"
description = "Convert Hugging Face safetensors to Orbax TensorStore with smart stacking"
requires-python = ">=3.11"
dependencies = [
  "gcsfs",
  "hf-transfer",
  "jax",
  "orbax-checkpoint>=0.11",
  "huggingface_hub",
  "safetensors",
  "typer",
  "tqdm",
]

[project.scripts]
hf-safetensors-to-orbax = "convert:app"

[tool.uv]
package = true
